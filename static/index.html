<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spindle</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/style.css">
    <script>
        var refreshToastTimer = null;
        function showRefreshToast(msg) {
            var t = document.getElementById('refresh-toast');
            t.textContent = msg;
            t.style.transition = 'none';
            t.style.opacity = '1';
            clearTimeout(refreshToastTimer);
            refreshToastTimer = setTimeout(function() {
                t.style.transition = 'opacity 1s';
                t.style.opacity = '0';
            }, 2500);
        }

        // Refresh all feeds in parallel by fanning out individual per-feed requests
        // from the browser. This is the only way to achieve concurrency given WASM's
        // single-threaded constraint (no goroutines = no server-side parallelism).
        function refreshAllFeeds(btn) {
            btn.disabled = true;
            var feedIds = Array.from(
                document.querySelectorAll('#feed-list [data-feed-id]')
            ).map(function(el) { return el.dataset.feedId; });

            if (feedIds.length === 0) {
                htmx.ajax('GET', '/api/ui/articles', {target: '#article-list', swap: 'innerHTML'});
                btn.disabled = false;
                return;
            }

            var totalNew = 0;
            var remaining = feedIds.length;

            feedIds.forEach(function(id) {
                fetch('/api/ui/feeds/' + id + '/refresh', {method: 'POST'})
                    .then(function(resp) {
                        var msg = resp.headers.get('X-Refresh-Message') || '';
                        var match = msg.match(/^(\d+)/);
                        if (match) totalNew += parseInt(match[1]);
                    })
                    .catch(function() {})
                    .finally(function() {
                        if (--remaining === 0) {
                            htmx.ajax('GET', '/api/ui/articles', {target: '#article-list', swap: 'innerHTML'});
                            htmx.ajax('GET', '/api/ui/feeds', {target: '#feed-list', swap: 'innerHTML'});
                            showRefreshToast(
                                totalNew === 0 ? 'Already up to date' :
                                totalNew === 1 ? '1 new article' :
                                totalNew + ' new articles'
                            );
                            btn.disabled = false;
                        }
                    });
            });
        }

        // Refresh all feeds in a specific folder in parallel, same approach as refreshAllFeeds.
        function refreshFolderFeeds(btn, folderId) {
            btn.disabled = true;
            var feedIds = Array.from(
                document.querySelectorAll('#feed-list [data-feed-id]')
            ).filter(function(el) {
                return el.closest('.folder-section') === btn.closest('.folder-section');
            }).map(function(el) { return el.dataset.feedId; });

            if (feedIds.length === 0) {
                htmx.ajax('GET', '/api/ui/articles?folder_id=' + folderId, {target: '#article-list', swap: 'innerHTML'});
                btn.disabled = false;
                return;
            }

            var totalNew = 0;
            var remaining = feedIds.length;

            feedIds.forEach(function(id) {
                fetch('/api/ui/feeds/' + id + '/refresh', {method: 'POST'})
                    .then(function(resp) {
                        var msg = resp.headers.get('X-Refresh-Message') || '';
                        var match = msg.match(/^(\d+)/);
                        if (match) totalNew += parseInt(match[1]);
                    })
                    .catch(function() {})
                    .finally(function() {
                        if (--remaining === 0) {
                            htmx.ajax('GET', '/api/ui/articles?folder_id=' + folderId, {target: '#article-list', swap: 'innerHTML'});
                            showRefreshToast(
                                totalNew === 0 ? 'Already up to date' :
                                totalNew === 1 ? '1 new article' :
                                totalNew + ' new articles'
                            );
                            btn.disabled = false;
                        }
                    });
            });
        }

        // htmx:afterRequest is a built-in HTMX event guaranteed to bubble to document.
        // We check the hx-post attribute to identify refresh/subscribe requests, then
        // read the message from a plain response header (no HTMX event parsing involved).
        document.addEventListener('htmx:afterRequest', function(e) {
            if (!e.detail.successful) return;
            var post = e.detail.elt.getAttribute('hx-post') || '';
            var msg = e.detail.xhr.getResponseHeader('X-Refresh-Message');
            if (/\/api\/ui\/feeds\/\d+\/refresh$/.test(post)) {
                if (msg) showRefreshToast(msg);
            } else if (post === '/api/ui/feeds') {
                // New feed subscribed: articles were already stored by addFeed,
                // so we reload the article list to show them, then toast the count.
                if (msg) {
                    htmx.ajax('GET', '/api/ui/articles', {target: '#article-list', swap: 'innerHTML'});
                    showRefreshToast(msg);
                }
            }
        });
    </script>
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>Spindle</h1>
                <span class="subtitle">Spin + WASM RSS Reader</span>
            </div>
            <div hx-get="/api/ui/auth-status" hx-trigger="load" hx-swap="innerHTML"></div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <div class="subscribe-form">
                    <form hx-post="/api/ui/feeds"
                          hx-target="#feed-list"
                          hx-swap="innerHTML"
                          hx-on::after-request="if(event.detail.successful) this.reset()">
                        <div class="subscribe-row">
                            <input type="url" name="url" placeholder="Paste feed URL..." required>
                            <button type="submit">+</button>
                        </div>
                        <input type="text" name="folder_name" placeholder="Folder (optional)">
                    </form>
                </div>
                <nav>
                    <div id="feed-list"
                         hx-get="/api/ui/feeds"
                         hx-trigger="load"
                         hx-swap="innerHTML">
                        <p class="loading">Loading...</p>
                    </div>
                </nav>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h2 id="content-title">All Articles</h2>
                    <div class="content-actions">
                        <span id="refresh-toast"></span>
                        <button hx-post="/api/ui/articles/mark-all-read"
                                hx-target="#article-list"
                                hx-swap="innerHTML"
                                class="btn-secondary">
                            Mark all read
                        </button>
                        <button onclick="refreshAllFeeds(this)"
                                class="btn-secondary">
                            Refresh
                        </button>
                    </div>
                </div>

                <div id="article-list"
                     hx-get="/api/ui/articles"
                     hx-trigger="load"
                     hx-swap="innerHTML">
                    <p class="loading">Loading articles...</p>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
